name: hood-scanner

on:
  schedule:
    - cron: '7 */2 * * *' # every 2 hours (UTC). Free on a private repo; public repos can go every 30 min.
  workflow_dispatch: # "Run workflow" button for a manual scan

permissions:
  contents: write # lets the bot commit its data folder back

concurrency:
  group: hood-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan Robinhood Chain
        run: node src/index.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save dataset + paper trades
        if: always()
        run: |
          git config user.name "hood-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
