[project]
name = "hoodstocks"
version = "0.1.0"
description = "Stock research engine for Hood Desk: free official sources, deterministic scoring, Telegram alerts."
requires-python = ">=3.11"
dependencies = []  # standard library only, so it runs anywhere for free

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hoodstocks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
